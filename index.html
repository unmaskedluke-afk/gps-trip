<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>GPS Trip Meter</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 500px;
      padding: 50px 24px 40px;
      text-align: center;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 45px;
      color: #aaa;
      letter-spacing: 2px;
    }

    .distance-label {
      color: #888;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .distance {
      font-size: 70px;
      font-weight: 700;
      margin: 5px 0;
      font-variant-numeric: tabular-nums;
    }

    .km {
      color: #999;
      font-size: 20px;
      margin-bottom: 45px;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 35px;
    }

    .stat {
      background: #1d1d1d;
      border-radius: 14px;
      padding: 20px 10px;
    }

    .stat-label {
      color: #777;
      font-size: 12px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 600;
    }

    .status {
      min-height: 25px;
      color: #999;
      margin-bottom: 20px;
      font-size: 14px;
    }

    button {
      width: 100%;
      height: 65px;
      border: 0;
      border-radius: 16px;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
    }

    #startButton {
      background: #28c76f;
      color: #07180e;
    }

    #stopButton {
      display: none;
      background: #ff4d4d;
      color: white;
    }

    .gps-active {
      color: #28c76f;
    }

    .warning {
      margin-top: 25px;
      color: #666;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>GPS TRIP METER</h1>

  <div class="distance-label">Distance</div>

  <div id="distance" class="distance">
    0.00
  </div>

  <div class="km">KM</div>

  <div class="stats">

    <div class="stat">
      <div class="stat-label">Time</div>
      <div id="time" class="stat-value">00:00:00</div>
    </div>

    <div class="stat">
      <div class="stat-label">Speed</div>
      <div id="speed" class="stat-value">0 km/h</div>
    </div>

    <div class="stat">
      <div class="stat-label">GPS Accuracy</div>
      <div id="accuracy" class="stat-value">--</div>
    </div>

    <div class="stat">
      <div class="stat-label">GPS</div>
      <div id="gpsStatus" class="stat-value">OFF</div>
    </div>

  </div>

  <div id="status" class="status">
    Ready to start
  </div>

  <button id="startButton" onclick="startTrip()">
    START TRIP
  </button>

  <button id="stopButton" onclick="stopTrip()">
    STOP TRIP
  </button>

  <div class="warning">
    Keep this page open while driving for the most reliable tracking.
  </div>

</div>

<script>

let watchID = null;
let previousPosition = null;
let totalDistance = 0;

let startTime = null;
let timerInterval = null;

let running = false;


// -----------------------------------
// START
// -----------------------------------

function startTrip() {

  if (!navigator.geolocation) {
    alert("GPS is not supported by this browser.");
    return;
  }

  totalDistance = 0;
  previousPosition = null;
  running = true;

  document.getElementById("distance").textContent = "0.00";
  document.getElementById("speed").textContent = "0 km/h";

  document.getElementById("startButton").style.display = "none";
  document.getElementById("stopButton").style.display = "block";

  document.getElementById("status").textContent =
    "Waiting for GPS...";

  document.getElementById("gpsStatus").textContent = "WAIT";
  document.getElementById("gpsStatus").className = "stat-value";


  // TIMER

  startTime = Date.now();

  timerInterval = setInterval(updateTimer, 1000);


  // GPS

  watchID = navigator.geolocation.watchPosition(

    positionUpdate,

    gpsError,

    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 15000
    }

  );

}


// -----------------------------------
// GPS UPDATE
// -----------------------------------

function positionUpdate(position) {

  if (!running) return;

  const lat = position.coords.latitude;
  const lon = position.coords.longitude;

  const accuracy = position.coords.accuracy;

  document.getElementById("accuracy").textContent =
    Math.round(accuracy) + " m";

  document.getElementById("gpsStatus").textContent = "ACTIVE";
  document.getElementById("gpsStatus").className =
    "stat-value gps-active";

  document.getElementById("status").textContent =
    "Trip recording";


  // SPEED

  if (position.coords.speed !== null) {

    let speedKmh = position.coords.speed * 3.6;

    if (speedKmh < 1) speedKmh = 0;

    document.getElementById("speed").textContent =
      Math.round(speedKmh) + " km/h";

  }


  // Ignore very inaccurate GPS readings

  if (accuracy > 50) {
    return;
  }


  const currentPosition = {
    latitude: lat,
    longitude: lon
  };


  if (previousPosition !== null) {

    const distance =
      calculateDistance(
        previousPosition.latitude,
        previousPosition.longitude,
        currentPosition.latitude,
        currentPosition.longitude
      );


    /*
      GPS can move slightly even while stationary.

      Ignore movements smaller than 3 metres.
    */

    if (distance >= 3) {

      totalDistance += distance;

      document.getElementById("distance").textContent =
        (totalDistance / 1000).toFixed(2);

    }

  }


  previousPosition = currentPosition;

}


// -----------------------------------
// DISTANCE CALCULATION
// Haversine Formula
// -----------------------------------

function calculateDistance(lat1, lon1, lat2, lon2) {

  const R = 6371000;

  const φ1 = lat1 * Math.PI / 180;
  const φ2 = lat2 * Math.PI / 180;

  const Δφ =
    (lat2 - lat1) * Math.PI / 180;

  const Δλ =
    (lon2 - lon1) * Math.PI / 180;


  const a =
    Math.sin(Δφ / 2) *
    Math.sin(Δφ / 2) +

    Math.cos(φ1) *
    Math.cos(φ2) *

    Math.sin(Δλ / 2) *
    Math.sin(Δλ / 2);


  const c =
    2 * Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );


  return R * c;

}


// -----------------------------------
// TIMER
// -----------------------------------

function updateTimer() {

  if (!startTime) return;

  const elapsed =
    Math.floor((Date.now() - startTime) / 1000);

  const hours =
    Math.floor(elapsed / 3600);

  const minutes =
    Math.floor((elapsed % 3600) / 60);

  const seconds =
    elapsed % 60;


  document.getElementById("time").textContent =

    String(hours).padStart(2, "0") + ":" +

    String(minutes).padStart(2, "0") + ":" +

    String(seconds).padStart(2, "0");

}


// -----------------------------------
// STOP
// -----------------------------------

function stopTrip() {

  running = false;

  if (watchID !== null) {

    navigator.geolocation.clearWatch(watchID);

    watchID = null;

  }


  clearInterval(timerInterval);


  document.getElementById("gpsStatus").textContent = "OFF";

  document.getElementById("gpsStatus").className =
    "stat-value";


  document.getElementById("status").textContent =
    "Trip completed";


  document.getElementById("stopButton").style.display =
    "none";

  document.getElementById("startButton").style.display =
    "block";

  document.getElementById("startButton").textContent =
    "START NEW TRIP";

}


// -----------------------------------
// GPS ERROR
// -----------------------------------

function gpsError(error) {

  let message = "GPS error.";

  if (error.code === 1)
    message = "Location permission denied.";

  if (error.code === 2)
    message = "Location unavailable.";

  if (error.code === 3)
    message = "GPS timed out.";


  document.getElementById("status").textContent =
    message;

}

</script>

</body>
</html>
